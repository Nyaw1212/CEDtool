<script>
  const state = { items: [], parsedItems: [] };
  const elements = {};

  document.addEventListener('DOMContentLoaded', () => {
    elements.searchInput = document.getElementById('searchInput');
    elements.refreshButton = document.getElementById('refreshButton');
    elements.recordCount = document.getElementById('recordCount');
    elements.loadingState = document.getElementById('loadingState');
    elements.errorState = document.getElementById('errorState');
    elements.priceTable = document.getElementById('priceTable');
    elements.priceTableBody = document.getElementById('priceTableBody');
    elements.parseButton = document.getElementById('parseButton');
    elements.invoiceText = document.getElementById('invoiceText');
    elements.parserError = document.getElementById('parserError');
    elements.parserSummary = document.getElementById('parserSummary');
    elements.parserResultsCard = document.getElementById('parserResultsCard');
    elements.parserTableBody = document.getElementById('parserTableBody');
    elements.invoiceNumber = document.getElementById('invoiceNumber');
    elements.invoiceDate = document.getElementById('invoiceDate');
    elements.parsedCount = document.getElementById('parsedCount');
    elements.matchedCount = document.getElementById('matchedCount');
    elements.newSkuCount = document.getElementById('newSkuCount');

    document.querySelectorAll('.tab-button').forEach(button => {
      button.addEventListener('click', () => activateTab(button.dataset.tab));
    });

    elements.searchInput.addEventListener('input', renderFilteredItems);
    elements.refreshButton.addEventListener('click', loadPriceData);
    elements.parseButton.addEventListener('click', parseInvoice);

    loadPriceData();
  });

  function activateTab(tabName) {
    document.querySelectorAll('.tab-button').forEach(button => {
      button.classList.toggle('active', button.dataset.tab === tabName);
    });

    document.getElementById('catalogTab').classList.toggle('active', tabName === 'catalog');
    document.getElementById('parserTab').classList.toggle('active', tabName === 'parser');
  }

  function callEngine(moduleName, actionName, payload = {}) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .runEngine(moduleName, actionName, payload);
    });
  }

  async function loadPriceData() {
    setLoading(true);
    clearError();

    try {
      const result = await callEngine('price', 'list', {});
      if (!result.success) throw new Error(result.error || 'Unable to load price data.');

      state.items = result.items || [];
      renderFilteredItems();
    } catch (error) {
      showError(error.message || String(error));
    } finally {
      setLoading(false);
    }
  }

  async function parseInvoice() {
    const text = elements.invoiceText.value.trim();
    clearParserError();

    if (!text) {
      showParserError('Paste invoice text before parsing.');
      return;
    }

    elements.parseButton.disabled = true;
    elements.parseButton.textContent = 'Parsing...';

    try {
      const result = await callEngine('parser', 'parseInvoice', { text });
      if (!result.success) throw new Error(result.error || 'Unable to parse invoice.');

      state.parsedItems = result.items || [];
      renderParserResult(result);
    } catch (error) {
      showParserError(error.message || String(error));
    } finally {
      elements.parseButton.disabled = false;
      elements.parseButton.textContent = 'Parse Invoice';
    }
  }

  function renderParserResult(result) {
    elements.invoiceNumber.textContent = result.invoice && result.invoice.number ? result.invoice.number : '—';
    elements.invoiceDate.textContent = result.invoice && result.invoice.date ? result.invoice.date : '—';
    elements.parsedCount.textContent = result.count || 0;
    elements.matchedCount.textContent = result.matchedCount || 0;
    elements.newSkuCount.textContent = result.newSkuCount || 0;
    elements.parserSummary.hidden = false;
    elements.parserResultsCard.hidden = false;
    elements.parserTableBody.innerHTML = '';

    const fragment = document.createDocumentFragment();

    state.parsedItems.forEach(item => {
      const row = document.createElement('tr');
      const badgeClass = item.catalogMatch ? 'badge matched' : 'badge new';
      const badgeText = item.catalogMatch ? 'LIST MATCH' : 'NEW SKU';

      row.innerHTML = `
        <td>${escapeHtml(item.sku)}</td>
        <td>${escapeHtml(item.description || item.invoiceDescription)}</td>
        <td class="number">${formatNumber(item.quantityShipped)}</td>
        <td class="number">${formatCurrency(item.price)}</td>
        <td class="number">${formatCurrency(item.extPrice)}</td>
        <td class="number">${formatCurrency(item.catalogPrice)}</td>
        <td><span class="${badgeClass}">${badgeText}</span></td>
      `;

      fragment.appendChild(row);
    });

    elements.parserTableBody.appendChild(fragment);
  }

  function renderFilteredItems() {
    const query = elements.searchInput.value.trim().toLowerCase();
    const filtered = !query
      ? state.items
      : state.items.filter(item =>
          item.sku.toLowerCase().includes(query) ||
          item.description.toLowerCase().includes(query)
        );

    renderTable(filtered);
  }

  function renderTable(items) {
    elements.priceTableBody.innerHTML = '';
    const fragment = document.createDocumentFragment();

    items.forEach(item => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${escapeHtml(item.sku)}</td>
        <td>${escapeHtml(item.description)}</td>
        <td class="number">${formatCurrency(item.price)}</td>
        <td class="number">${formatCurrency(item.extPrice)}</td>
      `;
      fragment.appendChild(row);
    });

    elements.priceTableBody.appendChild(fragment);
    elements.priceTable.hidden = false;
    elements.recordCount.textContent = `${items.length} item${items.length === 1 ? '' : 's'}`;
  }

  function formatCurrency(value) {
    if (value === null || value === undefined) return '—';
    return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(value);
  }

  function formatNumber(value) {
    if (value === null || value === undefined) return '—';
    return new Intl.NumberFormat('en-US').format(value);
  }

  function escapeHtml(value) {
    const element = document.createElement('div');
    element.textContent = String(value == null ? '' : value);
    return element.innerHTML;
  }

  function setLoading(isLoading) {
    elements.loadingState.hidden = !isLoading;
    if (isLoading) elements.priceTable.hidden = true;
  }

  function showError(message) {
    elements.errorState.textContent = message;
    elements.errorState.hidden = false;
  }

  function clearError() {
    elements.errorState.hidden = true;
    elements.errorState.textContent = '';
  }

  function showParserError(message) {
    elements.parserError.textContent = message;
    elements.parserError.hidden = false;
  }

  function clearParserError() {
    elements.parserError.hidden = true;
    elements.parserError.textContent = '';
  }
</script>
